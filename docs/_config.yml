title: WDGoWars On-Ramp
description: A leveled guide for new wardrivers, from WiGLE on your phone to advanced multi-source capture.
url: "https://hiroalleycat.github.io"
baseurl: "/wdgo-onramp"

# No external theme — custom layout in _layouts/default.html matches the
# Muninn / Heimdall cyberpunk-CRT identity (Orbitron + Share Tech Mono,
# cyan/pink/green palette, scanlines, CRT vignette).
# theme: jekyll-theme-cayman   # intentionally not set

# GitHub Pages allowlist plugins only.
plugins:
  - jekyll-relative-links
  - jekyll-default-layout
  - jekyll-readme-index
  - jekyll-titles-from-headings

# All pages render through _layouts/default.html unless they opt out.
defaults:
  - scope:
      path: ""
    values:
      layout: default

# Render .md links as clickable in docs/
relative_links:
  enabled: true
  collections: true

# Don't process the parent repo's Obsidian markdown files
exclude:
  - README.md
  - LICENSE
  - .gitignore
  - "*.canvas"
  - wdgo-newcomer-progression.md
  - wardriving-hardware-survey.md
  - CREDITS.md
  - CONTRIBUTING.md
  - shopping-list.md
  - .obsidian/
  - lab/
